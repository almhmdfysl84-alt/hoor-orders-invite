<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>تفعيل حساب السائق | إدارة النقل والطلبات</title><style>
  *{box-sizing:border-box}body{margin:0;background:#f6f7f8;color:#1e2932;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,460px);background:white;border:1px solid #e0e5e8;border-radius:18px;padding:26px;box-shadow:0 8px 28px #18273312}h1{font-size:24px;margin:0 0 10px;color:#182733}p{line-height:1.8;color:#64707a}.field{display:block;width:100%;padding:13px;border:1px solid #ccd4d9;border-radius:10px;font:inherit;margin:8px 0 14px}button,.app{display:block;width:100%;border:0;border-radius:10px;padding:14px;font:inherit;font-weight:700;text-align:center;text-decoration:none;cursor:pointer;margin-top:10px}.primary{background:#007780;color:white}.secondary{background:#182733;color:white}.status{font-size:14px;overflow-wrap:anywhere}.hide{display:none}.copyright{text-align:center;font-size:12px;color:#64707a;margin-top:22px}</style></head><body><main class="card"><h1>إدارة النقل والطلبات</h1><p id="intro">جارٍ التحقق من رابط الدعوة…</p><form id="form" class="hide"><label for="password">كلمة المرور الجديدة</label><input class="field" id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="8 أحرف على الأقل"><label for="confirm">تأكيد كلمة المرور</label><input class="field" id="confirm" type="password" minlength="8" autocomplete="new-password" required placeholder="أعد كتابة كلمة المرور"><button class="primary" id="save" type="submit">تفعيل الحساب وحفظ كلمة المرور</button></form><a id="openApp" class="app secondary hide" href="#">فتح التطبيق على Android</a><p id="status" class="status" role="status"></p><div class="copyright">© جميع الحقوق محفوظة لفيصل المحمد</div></main><script>
const PROJECT_URL="https://amrcbmgvrjdwebqxydqd.supabase.co";const ANON_KEY="sb_publishable_kic75sSFTpYZMYCORHTxww_OL";const hash=new URLSearchParams(location.hash.slice(1));const access=hash.get('access_token');const kind=hash.get('type');const intro=document.getElementById('intro');const form=document.getElementById('form');const status=document.getElementById('status');const app=document.getElementById('openApp');
if(!access||!(kind==='invite'||kind==='signup'||kind==='recovery')){intro.textContent='الرابط غير صالح أو انتهت صلاحيته. اطلب من المدير إرسال دعوة جديدة.';}
else {intro.textContent=kind==='invite'?'أكمل تفعيل حساب السائق بتعيين كلمة مرور. يمكنك إكمال ذلك هنا أو فتح التطبيق على Android.':'عيّن كلمة مرور جديدة لحسابك.';form.classList.remove('hide');if(kind==='invite'){app.classList.remove('hide');app.href='hoororders://invite'+location.hash;app.addEventListener('click',()=>{status.textContent='إذا كان التطبيق مثبتًا، فسيُفتح لإكمال التفعيل.';});}}
form.addEventListener('submit',async e=>{e.preventDefault();const a=document.getElementById('password').value;const b=document.getElementById('confirm').value;if(a.length<8){status.textContent='استخدم 8 أحرف على الأقل.';return;}if(a!==b){status.textContent='كلمتا المرور غير متطابقتين.';return;}const save=document.getElementById('save');save.disabled=true;save.textContent='جارٍ حفظ كلمة المرور…';try{const r=await fetch(PROJECT_URL+'/auth/v1/user',{method:'PUT',headers:{'apikey':ANON_KEY,'Authorization':'Bearer '+access,'Content-Type':'application/json'},body:JSON.stringify({password:a})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.msg||data.message||data.error_description||'تعذر حفظ كلمة المرور. اطلب رابطًا جديدًا.');status.textContent='تم حفظ كلمة المرور وتفعيل الحساب. افتح التطبيق وسجّل الدخول بالبريد وكلمة المرور الجديدة.';form.classList.add('hide');app.href='hoororders://login';app.textContent='فتح التطبيق لتسجيل الدخول';app.classList.remove('hide');}catch(err){status.textContent=err.message;save.disabled=false;save.textContent='إعادة المحاولة';}});
</script></body></html>
